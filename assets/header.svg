<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121110"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 190) scale(320)">
      <stop offset="0" stop-color="#D97757" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#D97757" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="60" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5EFE6"/>
      <stop offset=".6" stop-color="#F0C9B5"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#F5EFE6" stroke-opacity=".045"/>
    </pattern>
    <mask id="fade">
      <rect width="1200" height="380" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .spin{transform-origin:930px 190px;animation:spin 40s linear infinite}
      .spinr{transform-origin:930px 190px;animation:spin 26s linear infinite reverse}
      .pulse{transform-origin:930px 190px;animation:pulse 4s ease-in-out infinite}
      .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      .blink{animation:blink 1.1s steps(1) infinite}
      .dot{animation:dot 2.4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes blink{50%{opacity:0}}
      @keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#fade)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- orbit system -->
    <g class="spin">
      <circle cx="930" cy="190" r="150" stroke="#F5EFE6" stroke-opacity=".10" stroke-dasharray="2 10"/>
      <circle cx="1080" cy="190" r="6" fill="#D97757"/>
      <circle cx="780" cy="190" r="3" fill="#F5EFE6" fill-opacity=".6"/>
    </g>
    <g class="spinr">
      <circle cx="930" cy="190" r="104" stroke="#D97757" stroke-opacity=".35"/>
      <circle cx="930" cy="86" r="4.5" fill="#F0C9B5"/>
      <circle cx="1004" cy="264" r="3" fill="#D97757"/>
    </g>
    <g class="spin" style="animation-duration:14s">
      <circle cx="930" cy="190" r="62" stroke="#F5EFE6" stroke-opacity=".18" stroke-dasharray="40 14"/>
    </g>
    <g class="pulse">
      <circle cx="930" cy="190" r="30" fill="#D97757"/>
      <circle cx="930" cy="190" r="30" fill="url(#glow)"/>
      <path d="M918 182l-8 8 8 8M942 182l8 8-8 8M934 176l-8 28" stroke="#121110" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- floating tags -->
    <g class="m" font-size="13" fill="#F5EFE6" fill-opacity=".7">
      <g class="rise d2"><rect x="1010" y="62" width="104" height="28" rx="14" fill="#F5EFE6" fill-opacity=".06" stroke="#F5EFE6" stroke-opacity=".12"/><text x="1062" y="81" text-anchor="middle">flutter</text></g>
      <g class="rise d3"><rect x="760" y="290" width="96" height="28" rx="14" fill="#F5EFE6" fill-opacity=".06" stroke="#F5EFE6" stroke-opacity=".12"/><text x="808" y="309" text-anchor="middle">next.js</text></g>
      <g class="rise d4"><rect x="1040" y="298" width="104" height="28" rx="14" fill="#D97757" fill-opacity=".12" stroke="#D97757" stroke-opacity=".4"/><text x="1092" y="317" text-anchor="middle" fill="#F0C9B5">pytorch</text></g>
      <g class="rise d3"><rect x="740" y="78" width="90" height="28" rx="14" fill="#F5EFE6" fill-opacity=".06" stroke="#F5EFE6" stroke-opacity=".12"/><text x="785" y="97" text-anchor="middle">web3</text></g>
    </g>

    <!-- copy -->
    <g class="rise d1">
      <rect x="64" y="64" width="232" height="30" rx="15" fill="#D97757" fill-opacity=".12" stroke="#D97757" stroke-opacity=".45"/>
      <circle cx="84" cy="79" r="4" fill="#D97757" class="dot"/>
      <text x="98" y="84" class="m" font-size="13" fill="#F0C9B5" letter-spacing=".5">open for builds · 2026</text>
    </g>
    <text x="62" y="170" class="f rise d2" font-size="68" font-weight="700" letter-spacing="-2" fill="url(#title)">thelllmike</text>
    <text x="64" y="214" class="f rise d3" font-size="24" fill="#F5EFE6" fill-opacity=".82">Full-stack · Mobile · AI · Web3 engineer</text>
    <text x="64" y="244" class="f rise d3" font-size="17" fill="#F5EFE6" fill-opacity=".5">Building products at Clever Project — 180+ features shipped.</text>

    <g class="rise d4 m" font-size="15">
      <text x="64" y="306" fill="#D97757">~</text>
      <text x="80" y="306" fill="#F5EFE6" fill-opacity=".75">$ let's build something real <tspan fill="#D97757" fill-opacity="1" class="blink">▋</tspan></text>
    </g>

    <rect x=".5" y=".5" width="1199" height="379" rx="23.5" stroke="#F5EFE6" stroke-opacity=".08"/>
  </g>
</svg>
