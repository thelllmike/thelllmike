<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" fill="none">
<defs><radialGradient id="g"><stop offset="0" stop-color="#D97757" stop-opacity="0.26"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="400" height="210" rx="18"/></clipPath>
<style>.f{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
